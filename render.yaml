databases:
  - name: shortlink-db
    plan: free
services:
  - type: web
    name: shortlink-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: shortlink-db, property: connectionString}
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        sync: false
